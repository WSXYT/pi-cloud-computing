<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pi-cloud CLI i18n</title><style>
:root{color-scheme:dark;--bg:#0b0d0b;--text:#e7ebe5;--muted:#8f978e;--green:#7edc8b;--cyan:#78ced8;--yellow:#e4c36f;--line:#343934;--white:#fafcf9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;letter-spacing:0}.wrap{min-height:100vh;padding:24px clamp(12px,4vw,48px)}.terminal{max-width:1000px;margin:auto;border:1px solid var(--line);background:#111411}.title{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px}.lang{display:flex;gap:5px}.lang button{border-color:var(--line)}.screens{padding:18px 16px 12px;min-height:590px}.screen{display:none}.screen.active{display:block}.line{line-height:1.55;min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}.prompt{color:var(--green)}.cmd{color:var(--white)}.muted{color:var(--muted)}.green{color:var(--green)}.cyan{color:var(--cyan)}.yellow{color:var(--yellow)}.heading{margin:16px 0 8px;color:var(--white);font-weight:700}.fingerprint{padding:8px 10px;border-left:2px solid var(--cyan);background:#171b17;color:var(--cyan);overflow-wrap:anywhere}.row{display:grid;grid-template-columns:24px minmax(170px,1fr) minmax(140px,.8fr);gap:8px;padding:5px 6px}.row.on{background:#1c211c}.check{color:var(--green)}.actions{margin:15px 0 8px;color:var(--muted)}.key{display:inline-block;border:1px solid #4c524c;border-radius:3px;padding:1px 5px;color:var(--white);margin-right:4px}.input{margin-top:16px;border:1px solid #475047;padding:8px 9px;color:var(--white)}.input:before{content:"> ";color:var(--green)}.status{margin-top:14px;padding-top:9px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 13px;border-top:1px solid var(--line)}button{font:inherit;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:3px;padding:5px 8px;cursor:pointer}button:hover{border-color:var(--line);color:var(--text)}button.active{background:var(--green);border-color:var(--green);color:#071008;font-weight:700}.note{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:650px){.row{grid-template-columns:24px 1fr}.row span:last-child{grid-column:2;color:var(--muted)}.screens{min-height:690px}.title{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><main class="terminal"><div class="title"><span>pi · pi-cloud-computing · <span id="modeLabel">纯 CLI 原型</span></span><div class="lang"><button data-lang="zh-CN" class="active">简体中文</button><button data-lang="en">English</button></div></div><div class="screens">
<section id="language" class="screen active"></section><section id="install" class="screen"></section><section id="pair" class="screen"></section><section id="submit" class="screen"></section><section id="run" class="screen"></section><section id="result" class="screen"></section>
</div><nav class="tabs"><button data-screen="language" class="active"></button><button data-screen="install"></button><button data-screen="pair"></button><button data-screen="submit"></button><button data-screen="run"></button><button data-screen="result"></button></nav></main></div><script>
const copy={
'zh-CN':{mode:'纯 CLI 原型',tabs:['1 语言','2 服务端安装','3 客户端配对','4 提交任务','5 云端队列','6 回传结果'],screens:{
language:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud config language zh-CN</span></div><div class="line green">✓ 客户端语言已设置为简体中文</div><div class="line"><span class="prompt">server$</span> <span class="cmd">pi-cloud config set language zh-CN</span></div><div class="line green">✓ 服务端 CLI 语言已设置为简体中文</div><div class="heading">国际化行为</div><div class="line">客户端默认语言    跟随操作系统</div><div class="line">服务端默认语言    跟随服务器环境变量</div><div class="line">协议传输          <span class="cyan">稳定错误码 + 结构化参数</span></div><div class="line">未知语言          回退到 English</div><div class="line">客户端与服务端    可以使用不同语言</div><div class="heading">示例</div><div class="line yellow">WARN_PLUGIN_PLATFORM_MISMATCH</div><div class="line">客户端显示：插件 local-build 使用 Windows 路径，Linux 服务器上可能不可用。</div><div class="line muted">协议不会传输写死的中文或英文错误句子。</div><div class="note">右上角“简体中文 / English”会切换整个 CLI 原型，包括安装、配对、状态、错误和操作提示。</div>`,
install:`<div class="line"><span class="prompt">server$</span> <span class="cmd">pi-cloud worker install --listen 0.0.0.0:9443</span></div><div class="line muted">正在为 IP 203.0.113.24 生成自签名 TLS 证书...</div><div class="line green">✓ 证书已生成：/var/lib/pi-cloud/tls/server.crt</div><div class="line green">✓ 私钥已加密保存，文件权限 0600</div><div class="line green">✓ systemd 服务已安装并启动</div><div class="heading">配对此 Worker</div><div class="line">地址          <span class="cyan">https://203.0.113.24:9443</span></div><div class="line">配对码        <span class="yellow">482 193</span>  10:00 后过期</div><div class="line">TLS SHA-256 指纹</div><div class="fingerprint">8A:5E:29:7B:F4:11:90:21:61:AB:08:70:A3:CD:6E:26:<br>F0:E5:3A:B8:B0:11:47:A5:6D:79:83:4B:C2:95:1F:71</div><div class="line yellow">请保持此终端可见，客户端必须显示相同指纹。</div><div class="note">证书包含 IP SAN 203.0.113.24。IP 变化后运行 `pi-cloud worker tls rotate --ip 新IP` 并重新配对。</div>`,
pair:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud pair 203.0.113.24:9443</span></div><div class="heading">检测到未信任的自签名证书</div><div class="line">服务器        203.0.113.24:9443</div><div class="line">TLS SHA-256 指纹</div><div class="fingerprint">8A:5E:29:7B:F4:11:90:21:61:AB:08:70:A3:CD:6E:26:<br>F0:E5:3A:B8:B0:11:47:A5:6D:79:83:4B:C2:95:1F:71</div><div class="line yellow">请与服务器上的 `pi-cloud worker status` 输出核对。</div><div class="line">信任并固定此证书？ <span class="green">[y/N]</span> y</div><div class="line">配对码：<span class="yellow">482193</span></div><div class="line green">✓ 配对成功 · 证书已固定 · 令牌已保存</div><div class="line muted">证书变化时会拒绝连接，直到执行 `/cloud unpair`。</div>`,
submit:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud run 修复登录超时并运行相关测试</span></div><div class="heading">提交到 203.0.113.24 前确认</div><div class="row on"><span class="check">✓</span><span>当前 Pi 会话</span><span>42 entries · 186 KB</span></div><div class="row"><span class="check">✓</span><span>Git 工作区</span><span>8 个修改 · 2 个未跟踪</span></div><div class="row"><span class="check">✓</span><span>全局 Pi 运行环境</span><span>12 个包 · 7 个资源</span></div><div class="row"><span class="check">✓</span><span>Provider 与模型</span><span>3 个 Provider</span></div><div class="row"><span class="check">✓</span><span>已授权秘密</span><span>2 个未变 · 1 个已变更</span></div><div class="row"><span class="yellow">!</span><span>平台差异</span><span>1 条警告 · 继续</span></div><div class="actions"><span class="key">↑↓</span>选择 <span class="key">Space</span>开关 <span class="key">A</span>全选 <span class="key">Enter</span>提交 <span class="key">Esc</span>取消</div><div class="line yellow">! local-build 使用 Windows 专用路径，在 Linux Worker 上可能失败。</div>`,
run:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud status</span></div><div class="line"><span class="green">● 已连接</span> 203.0.113.24:9443 · task_01JZ8M</div><div class="line muted">同步完成 · Git 1.8 MB · 环境未变化</div><div class="line"><span class="cyan">remote›</span> 我先定位登录超时的共享调用路径。</div><div class="line muted">工具  rg "login timeout|AbortSignal" src tests</div><div class="line muted">工具  read src/auth/client.ts</div><div class="line"><span class="cyan">remote›</span> 根因在共享请求函数未向重试分支传递 signal。</div><div class="input">也检查刷新令牌流程是否受影响</div><div class="line muted">已作为 followUp 加入云端 Pi 队列</div><div class="status"><span class="green">● 云端运行中</span><span>队列 1</span><span>交互模式</span><span>Esc 中止</span></div>`,
result:`<div class="line green">✓ 云端任务已完成 · 测试通过</div><div class="heading">结果可以回传</div><div class="line">会话          <span class="green">+18 个原生 entries</span></div><div class="line">Git commit    <span class="cyan">9f41c2a 修复认证重试取消</span></div><div class="line">文件          3 个修改 · +47 -12</div><div class="line">验证          npm test -- auth <span class="green">通过</span></div><div class="actions"><span class="key">Enter</span>应用 commit 并合并会话 <span class="key">D</span>查看 diff <span class="key">L</span>稍后 <span class="key">Esc</span>关闭</div><div class="line muted">绝不覆盖本地变化；Git 或会话基线不匹配时停止合并。</div><div class="status"><span class="green">等待应用</span><span>保留到用户删除</span></div>`}},
en:{mode:'CLI-only prototype',tabs:['1 language','2 server install','3 client pairing','4 submit task','5 remote queue','6 retrieve result'],screens:{
language:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud config language en</span></div><div class="line green">✓ Client language set to English</div><div class="line"><span class="prompt">server$</span> <span class="cmd">pi-cloud config set language en</span></div><div class="line green">✓ Server CLI language set to English</div><div class="heading">Internationalization behavior</div><div class="line">Client default      Follow operating-system locale</div><div class="line">Server default      Follow server locale environment</div><div class="line">Protocol payload    <span class="cyan">Stable error code + structured parameters</span></div><div class="line">Unknown locale      Fall back to English</div><div class="line">Client and server   May use different languages</div><div class="heading">Example</div><div class="line yellow">WARN_PLUGIN_PLATFORM_MISMATCH</div><div class="line">Client display: Plugin local-build uses a Windows path and may not work on the Linux server.</div><div class="line muted">The protocol does not transmit hard-coded Chinese or English error sentences.</div><div class="note">Use the “简体中文 / English” controls in the title bar to switch the complete CLI flow.</div>`,
install:`<div class="line"><span class="prompt">server$</span> <span class="cmd">pi-cloud worker install --listen 0.0.0.0:9443</span></div><div class="line muted">Generating self-signed TLS certificate for IP 203.0.113.24...</div><div class="line green">✓ Certificate created: /var/lib/pi-cloud/tls/server.crt</div><div class="line green">✓ Private key encrypted and stored with mode 0600</div><div class="line green">✓ systemd service installed and started</div><div class="heading">Pair this Worker</div><div class="line">Address       <span class="cyan">https://203.0.113.24:9443</span></div><div class="line">Pairing code  <span class="yellow">482 193</span>  expires in 10:00</div><div class="line">TLS SHA-256 fingerprint</div><div class="fingerprint">8A:5E:29:7B:F4:11:90:21:61:AB:08:70:A3:CD:6E:26:<br>F0:E5:3A:B8:B0:11:47:A5:6D:79:83:4B:C2:95:1F:71</div><div class="line yellow">Keep this terminal visible. The client must show the same fingerprint.</div><div class="note">The certificate contains IP SAN 203.0.113.24. If the IP changes, run `pi-cloud worker tls rotate --ip NEW_IP` and pair again.</div>`,
pair:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud pair 203.0.113.24:9443</span></div><div class="heading">Untrusted self-signed certificate detected</div><div class="line">Server        203.0.113.24:9443</div><div class="line">TLS SHA-256 fingerprint</div><div class="fingerprint">8A:5E:29:7B:F4:11:90:21:61:AB:08:70:A3:CD:6E:26:<br>F0:E5:3A:B8:B0:11:47:A5:6D:79:83:4B:C2:95:1F:71</div><div class="line yellow">Compare it with `pi-cloud worker status` on the server.</div><div class="line">Trust and pin this certificate? <span class="green">[y/N]</span> y</div><div class="line">Pairing code: <span class="yellow">482193</span></div><div class="line green">✓ Paired · certificate pinned · token stored</div><div class="line muted">A changed certificate is rejected until `/cloud unpair` is used.</div>`,
submit:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud run Fix the login timeout and run related tests</span></div><div class="heading">Confirm submission to 203.0.113.24</div><div class="row on"><span class="check">✓</span><span>Current Pi session</span><span>42 entries · 186 KB</span></div><div class="row"><span class="check">✓</span><span>Git workspace</span><span>8 changed · 2 untracked</span></div><div class="row"><span class="check">✓</span><span>Global Pi runtime</span><span>12 packages · 7 resources</span></div><div class="row"><span class="check">✓</span><span>Providers and models</span><span>3 providers</span></div><div class="row"><span class="check">✓</span><span>Authorized secrets</span><span>2 unchanged · 1 changed</span></div><div class="row"><span class="yellow">!</span><span>Platform differences</span><span>1 warning · continue</span></div><div class="actions"><span class="key">↑↓</span>select <span class="key">Space</span>toggle <span class="key">A</span>all <span class="key">Enter</span>submit <span class="key">Esc</span>cancel</div><div class="line yellow">! local-build uses a Windows-only path and may fail on the Linux Worker.</div>`,
run:`<div class="line"><span class="prompt">pi&gt;</span> <span class="cmd">/cloud status</span></div><div class="line"><span class="green">● connected</span> 203.0.113.24:9443 · task_01JZ8M</div><div class="line muted">Sync complete · Git 1.8 MB · environment unchanged</div><div class="line"><span class="cyan">remote›</span> I will locate the shared login-timeout call path first.</div><div class="line muted">tool  rg "login timeout|AbortSignal" src tests</div><div class="line muted">tool  read src/auth/client.ts</div><div class="line"><span class="cyan">remote›</span> The shared request function does not pass the signal into the retry path.</div><div class="input">Also check whether token refresh is affected</div><div class="line muted">Queued to the remote Pi as followUp</div><div class="status"><span class="green">● cloud running</span><span>queue 1</span><span>interactive</span><span>Esc abort</span></div>`,
result:`<div class="line green">✓ Remote task completed · tests passed</div><div class="heading">Result ready</div><div class="line">Session       <span class="green">+18 native entries</span></div><div class="line">Git commit    <span class="cyan">9f41c2a fix auth retry cancellation</span></div><div class="line">Files         3 changed · +47 -12</div><div class="line">Verification  npm test -- auth <span class="green">passed</span></div><div class="actions"><span class="key">Enter</span>apply commit + merge session <span class="key">D</span>view diff <span class="key">L</span>later <span class="key">Esc</span>close</div><div class="line muted">Local changes are never overwritten. A mismatched Git or session base stops the merge.</div><div class="status"><span class="green">ready to apply</span><span>retained until deleted</span></div>`}}};
let lang='zh-CN',screen='language';const screenEls=[...document.querySelectorAll('.screen')],screenBtns=[...document.querySelectorAll('[data-screen]')],langBtns=[...document.querySelectorAll('[data-lang]')];function render(){document.documentElement.lang=lang;document.getElementById('modeLabel').textContent=copy[lang].mode;screenEls.forEach(x=>x.innerHTML=copy[lang].screens[x.id]);screenBtns.forEach((x,i)=>x.textContent=copy[lang].tabs[i]);langBtns.forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));screenEls.forEach(x=>x.classList.toggle('active',x.id===screen));screenBtns.forEach(x=>x.classList.toggle('active',x.dataset.screen===screen))}langBtns.forEach(x=>x.onclick=()=>{lang=x.dataset.lang;render()});screenBtns.forEach(x=>x.onclick=()=>{screen=x.dataset.screen;render()});render();
</script></body></html>
