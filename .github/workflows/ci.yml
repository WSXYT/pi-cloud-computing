name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.2.2; actions/setup-node v4.4.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack:smoke
      - if: runner.os != 'Windows'
        run: bash -n scripts/install.sh scripts/ci-install-worker.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          $null = [scriptblock]::Create(
          (Get-Content -Raw scripts/install.ps1))

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: >-
          docker build --file deploy/Dockerfile
          --tag pi-cloud-computing:ci .
      - run: >-
          docker build --file deploy/runner.Dockerfile
          --tag pi-cloud-worker:latest .
      - run: docker image inspect pi-cloud-computing:ci pi-cloud-worker:latest
      - name: Execute real Pi through the production Docker runner
        run: >-
          node --test --test-name-pattern="real Worker Pi"
          dist/test/client-native.test.js
        env:
          PI_CLOUD_TEST_DOCKER: '1'
      - name: Install and operate Worker as a non-root sudo user
        run: bash scripts/ci-install-worker.sh
